<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deadline Task Manager</title>

<style>

/* ===== DARK TEEN DASHBOARD THEME ===== */

body {
    background: radial-gradient(circle at top, #111 0%, #000 60%);
    color: #ff2b2b;
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    justify-content: center;
    padding-top: 60px;
    min-height: 100vh;
    overflow-x: hidden;
}

/* Subtle animated red glow background */
body::before {
    content: "";
    position: fixed;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(255,0,0,0.15), transparent 70%);
    top: -200px;
    right: -200px;
    animation: glowMove 8s infinite alternate ease-in-out;
    z-index: -1;
}

@keyframes glowMove {
    from { transform: translateY(0px); }
    to { transform: translateY(80px); }
}

.container {
    width: 90%;
    max-width: 600px;
    animation: fadeInPage 0.8s ease;
}

@keyframes fadeInPage {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

h1 {
    text-align: center;
    margin-bottom: 30px;
    letter-spacing: 3px;
    font-weight: 600;
}

/* Input Area */
.input-area {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 30px;
}

input, button {
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #ff2b2b;
    background: #111;
    color: #ff2b2b;
    transition: 0.3s ease;
}

input:focus {
    outline: none;
    box-shadow: 0 0 8px rgba(255,0,0,0.6);
}

button {
    cursor: pointer;
}

button:hover {
    background: #ff2b2b;
    color: black;
}

/* Task Card */
.task {
    background: #111;
    padding: 18px;
    margin-bottom: 15px;
    border-left: 4px solid #ff2b2b;
    border-radius: 8px;
    transition: 0.3s ease;
    animation: slideIn 0.4s ease;
}

@keyframes slideIn {
    from { opacity: 0; transform: translateX(-20px); }
    to { opacity: 1; transform: translateX(0); }
}

.task:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(255,0,0,0.2);
}

.task small {
    display: block;
    margin-top: 6px;
    font-size: 13px;
}

.actions {
    margin-top: 12px;
}

.actions button {
    margin-right: 10px;
    font-size: 12px;
}

/* Submitted Animation */
.submitted {
    color: #00ff88;
    border-left: 4px solid #00ff88;
    animation: successFlash 0.6s ease;
}

@keyframes successFlash {
    0% { background: rgba(0,255,100,0.1); }
    100% { background: #111; }
}

/* Overdue Pulse Effect */
.overdue {
    color: #ff0000;
    border-left: 4px solid #ff0000;
    animation: pulseRed 1.5s infinite;
}

@keyframes pulseRed {
    0% { box-shadow: 0 0 0px rgba(255,0,0,0.4); }
    50% { box-shadow: 0 0 15px rgba(255,0,0,0.6); }
    100% { box-shadow: 0 0 0px rgba(255,0,0,0.4); }
}

</style>
</head>
<body>

<div class="container">
    <h1>DEADLINE MANAGER</h1>

    <div class="input-area">
        <input type="text" id="taskInput" placeholder="Enter Task">
        <input type="date" id="deadlineInput">
        <button onclick="addTask()">Add Task</button>
    </div>

    <div id="taskList"></div>
</div>


<script>
let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
function addTask() {
    const taskText = document.getElementById("taskInput").value.trim();
    const deadline = document.getElementById("deadlineInput").value;

    if (taskText === "" || deadline === "") {
        alert("Please enter task and deadline");
        return;
    }

    const task = {
        text: taskText,
        deadline: deadline,
        status: "Pending"
    };

    tasks.push(task);
    localStorage.setItem("tasks", JSON.stringify(tasks));

    renderTasks();

    document.getElementById("taskInput").value = "";
    document.getElementById("deadlineInput").value = "";
}

function deleteTask(index) {
    tasks.splice(index, 1);
    localStorage.setItem("tasks", JSON.stringify(tasks));
    renderTasks();
}

function markSubmitted(index) {
    tasks[index].status = "Submitted";
    localStorage.setItem("tasks", JSON.stringify(tasks));
    renderTasks();
}function renderTasks() {
    const taskList = document.getElementById("taskList");
    taskList.innerHTML = "";

    const today = new Date().toISOString().split("T")[0];
    tasks.sort((a, b) => new Date(a.deadline) - new Date(b.deadline));
    tasks.forEach((task, index) => {

        const taskDiv = document.createElement("div");
        taskDiv.classList.add("task");

        let statusText = task.status;

        if (task.deadline < today && task.status !== "Submitted") {
            statusText = "Unsubmitted (Deadline Passed)";
            taskDiv.classList.add("overdue");
        }

        if (task.status === "Submitted") {
            taskDiv.classList.add("submitted");
        }

        taskDiv.innerHTML = `
            <strong>${task.text}</strong>
            <small>Deadline: ${task.deadline}</small>
            <small>Status: ${statusText}</small>
            <div class="actions">
                <button onclick="markSubmitted(${index})">Mark Submitted</button>
                <button onclick="deleteTask(${index})">Delete</button>
            </div>
        `;

        taskList.appendChild(taskDiv);
    });
}
renderTasks();
</script>

</body>

</html>
